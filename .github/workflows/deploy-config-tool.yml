name: deploy-config-tool
on:
  push:
    branches: [flask-parity, master]
    paths:
      - 'config-tool-vial/**'
      - '.github/workflows/deploy-config-tool.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: config-tool-vial
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages' deployment queue occasionally stalls for 10+ minutes
          # (2026-08-06: five failed deploys from queue congestion). The
          # default 10-minute timeout then cancels a deployment that would
          # have succeeded — wait up to 30 instead.
          timeout: 1800000
