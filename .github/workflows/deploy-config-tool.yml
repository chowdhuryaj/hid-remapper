name: deploy-config-tool
on:
  push:
    branches: [flask-parity, master]
    paths:
      - 'config-tool-vial/**'
      - '.github/workflows/deploy-config-tool.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: config-tool-vial
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # NOTE: deploy-pages@v4 clamps this to 10 minutes internally
          # (observed 2026-08-06: input echoed 1800000, abort at exactly
          # 600s), so it cannot outlast a long Pages-queue stall. Kept at
          # the documented max as a no-op-today, works-if-they-unclamp-it.
          # When the queue stalls (deployment_queued for 10+ min), the only
          # fix is re-dispatching once GitHub's backend recovers.
          timeout: 1800000
